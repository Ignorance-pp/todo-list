<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List - 任务管理</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1>📋 我的任务清单</h1>
            <p class="subtitle">简单高效地管理每一天</p>
        </header>

        <!-- 输入区域 -->
        <div class="input-section">
            <input 
                type="text" 
                id="taskInput" 
                class="task-input" 
                placeholder="输入新任务，按回车添加..."
                autocomplete="off"
            >
            <button id="addBtn" class="add-btn">添加任务</button>
        </div>

        <!-- 筛选按钮 -->
        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="active">未完成</button>
            <button class="filter-btn" data-filter="completed">已完成</button>
        </div>

        <!-- 任务列表 -->
        <ul id="taskList" class="task-list">
            <!-- 任务项会动态生成 -->
        </ul>

        <!-- 空状态提示 -->
        <div id="emptyState" class="empty-state">
            <span class="empty-icon">📝</span>
            <p>还没有任务，添加一个开始吧</p>
        </div>

        <!-- 底部统计栏 -->
        <div class="footer">
            <span id="taskCount" class="task-count">总共 0 项，未完成 0 项</span>
            <button id="clearCompleted" class="clear-btn">清除已完成</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
